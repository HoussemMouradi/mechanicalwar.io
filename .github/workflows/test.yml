name: Game regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: assets-and-authority
            files: tests/asset-cache.spec.js tests/graphics-budget.spec.js tests/smoke-budget.spec.js tests/survival-host.spec.js
          - suite: gameplay
            files: tests/game.spec.js tests/tactical.spec.js
          - suite: graphics
            files: tests/graphics.spec.js
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test -- ${{ matrix.files }}
        env:
          GRAPHICS_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-test-results-${{ matrix.suite }}
          path: test-results/
          retention-days: 7
